<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
<title>Sistem Informasi Keuangan</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: #172a3b; color: #eef2ef; font: 15px/1.5 'Segoe UI', sans-serif; }
  .box { text-align: center; }
  h1 { font-size: 26px; margin: 18px 0 6px; letter-spacing: -.02em; }
  p { color: #9fb1b7; margin: 0; }
  .bar { width: 220px; height: 3px; background: #2f4555; border-radius: 3px; margin: 26px auto 0; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #d4432a; border-radius: 3px; animation: geser 1.1s ease-in-out infinite; }
  @keyframes geser { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; } }
</style>
</head>
<body>
  <div class="box">
    <h1>Sistem Informasi Keuangan</h1>
    <p>Menyiapkan data lokal…</p>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
